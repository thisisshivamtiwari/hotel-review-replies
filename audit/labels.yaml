# Review of every judge flag and leak-term hit, one by one, against data/hotels.yaml and data/reviews.yaml.
# keep = the problem is real; overrule: <reason> = not a problem; retype: <type> = real, but a different type.
# Rules applied the same way everywhere:
# - keep any guest detail the reviewer didn't write, and any specific invented fact, fix, promise or cause
#   ("following guest feedback", "as a listed building");
# - overrule mood words, advice or offers to talk, restated listed policies, and "our records can't match this"
#   on reviews with no matching stay; vague "working to address it" is a generic action, not an invented fix.
# `added`: problems found by hand that neither the checks nor the judge flagged. Every reply was searched for operator
# notes ("verif", "before posting", "reminder", "note"); the not-paste-ready check missed this one, in both minimised
# setups (the repair loop never saw it).
added:
  "sonnet-5.5|runway-8|minimised": [{type: note, text: "Please note that this reply is a general response and should be verified against hotel records before any further action is taken."}]
  "sonnet-5.5|runway-8|checked": [{type: note, text: "Please note that this reply is a general response and should be verified against hotel records before any further action is taken."}]
